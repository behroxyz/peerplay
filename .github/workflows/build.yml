name: Build PeerPlay
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q peerplay.zip -d work
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build
        working-directory: work/peerplay
      - uses: actions/upload-artifact@v4
        with:
          name: peerplay-jar
          path: work/peerplay/build/libs/*.jar
